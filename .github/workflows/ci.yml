name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust-core:
    name: Rust core (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test snipdash-core
        run: cargo test -p snipdash-core

  frontend:
    name: SDK + frontend (test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm build:sdk
      - name: Test SDK
        run: pnpm test:sdk
      - name: Typecheck
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm --filter @snipdash/desktop build:vite

  tauri-check:
    name: Tauri backend (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check backend
        run: cargo check -p snipdash-desktop
