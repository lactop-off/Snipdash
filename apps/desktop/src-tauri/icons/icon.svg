<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1f57" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App background (squircle-ish rounded square) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Dashboard tiles -->
  <g filter="url(#shadow)">
    <!-- Top-left: the accent "snippet" card -->
    <rect x="190" y="190" width="300" height="300" rx="44" fill="#1d4ed8"/>
    <rect x="226" y="250" width="228" height="26" rx="13" fill="#ffffff"/>
    <rect x="226" y="300" width="186" height="26" rx="13" fill="#bfdbfe"/>
    <rect x="226" y="350" width="210" height="26" rx="13" fill="#bfdbfe"/>
    <rect x="226" y="400" width="120" height="26" rx="13" fill="#93c5fd"/>

    <!-- Top-right: launcher card (arrow) -->
    <rect x="534" y="190" width="300" height="300" rx="44" fill="#ffffff"/>
    <path d="M624 400 L724 300 M724 300 L724 366 M724 300 L658 300"
          stroke="#2563eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Bottom-left: todo card (check) -->
    <rect x="190" y="534" width="300" height="300" rx="44" fill="#ffffff"/>
    <path d="M250 690 L312 752 L430 616"
          stroke="#10b981" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Bottom-right: code card (lines) -->
    <rect x="534" y="534" width="300" height="300" rx="44" fill="#ffffff"/>
    <rect x="570" y="594" width="180" height="22" rx="11" fill="#cbd5e1"/>
    <rect x="600" y="640" width="150" height="22" rx="11" fill="#cbd5e1"/>
    <rect x="600" y="686" width="120" height="22" rx="11" fill="#cbd5e1"/>
    <rect x="570" y="732" width="200" height="22" rx="11" fill="#cbd5e1"/>
  </g>
</svg>
